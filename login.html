<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - Jukebox Junction</title>
    <link rel="stylesheet" href="resources/css/base.css">
    <link rel="stylesheet" href="resources/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Righteous&display=swap" rel="stylesheet">
    <link rel="icon" href="resources/icons/boombox.ico" type="image/x-icon">
    <script src="resources/js/loginindex.js"></script>
    <script src="resources/js/login.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo"><span id="vinyl-icon"></span>Jukebox Junction</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#collection">Collection</a>
        <a href="game.html">Game</a>
        <a href="login.html" id="login" aria-current="page">Log in</a>
      </nav>
    </header>

    <main>
      <div class="login-container">
        <form class="login-form">
          <h1>Log In</h1>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Username" required/>

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Password" required/>
          <div class="buttons-row">
            <button type="submit" id="login-btn" class="btn">Login</button>
            <button type="button" id="logout-btn" class="btn btn-red" style="display: none">
              Logout
            </button>
          </div>
          <p id="login-output"></p>
          <p id="retry-timer"></p>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2024 Jukebox Junction</p>
    </footer>
  </body>
</html>
